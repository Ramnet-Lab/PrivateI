# Two services: the app (upload, processing, graph) and Neo4j behind it.
#
# The models are NOT a service here. They run through Docker Model Runner, a
# Docker Desktop feature that executes models natively on the host - which on a
# Mac means the Metal GPU. Measured on this project with the same 12B model:
# 35 tokens/sec through Model Runner against 4.4 in an Ollama container (the
# Docker VM has no GPU) and 9.4 under a native Ollama. Containers reach it at
# http://model-runner.docker.internal/v1 ; start.sh enables it and pulls the
# models. The model weights never enter the Docker VM, so the VM needs memory
# only for the app and Neo4j.
#
# Every published port is bound to 127.0.0.1, so nothing is reachable from the
# network.

name: docanalysis

services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: docanalysis/app
    restart: unless-stopped
    init: true
    environment:
      # Docker Model Runner serves generation, vision, and embeddings alike.
      MODEL_URL: ${MODEL_URL:-http://model-runner.docker.internal/v1}
      EMBED_MODEL_URL: ${EMBED_MODEL_URL:-http://model-runner.docker.internal/v1}
      VLM_MODEL: ${VLM_MODEL:-}
      TEXT_MODEL: ${TEXT_MODEL:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      VLM_TEMPERATURE: ${VLM_TEMPERATURE:-0}
      TEXT_TEMPERATURE: ${TEXT_TEMPERATURE:-0}
      VLM_NUM_CTX: ${VLM_NUM_CTX:-8192}
      TEXT_NUM_CTX: ${TEXT_NUM_CTX:-16384}
      # CPU-only inference is slow enough that the old 600s ceiling cut real
      # pages off mid-answer. start.sh raises this further for container mode.
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-1800}
      OLLAMA_RETRIES: ${OLLAMA_RETRIES:-3}
      MODEL_THINKING: ${MODEL_THINKING:-false}
      # 0 means no cap. Reasoning models spend part of the budget thinking
      # before they answer, so a cap truncates the answer rather than the
      # deliberation - which is how a page ends mid-sentence or a JSON reply
      # arrives unclosed. The request timeout is the real backstop.
      EXTRACT_NUM_PREDICT: ${EXTRACT_NUM_PREDICT:-0}
      CHAT_NUM_PREDICT: ${CHAT_NUM_PREDICT:-0}
      REPORT_NUM_PREDICT: ${REPORT_NUM_PREDICT:-0}
      TRANSCRIBE_NUM_PREDICT: ${TRANSCRIBE_NUM_PREDICT:-0}
      PDF_DPI: ${PDF_DPI:-300}
      USE_EMBEDDED_TEXT_LAYER: ${USE_EMBEDDED_TEXT_LAYER:-true}
      EMBEDDED_TEXT_MIN_CHARS: ${EMBEDDED_TEXT_MIN_CHARS:-120}
      OCR_CONFIDENCE_THRESHOLD: ${OCR_CONFIDENCE_THRESHOLD:-82}
      OCR_MIN_WORDS: ${OCR_MIN_WORDS:-25}
      TESSERACT_LANG: ${TESSERACT_LANG:-eng}
      MERGE_THRESHOLD: ${MERGE_THRESHOLD:-88}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env - run ./start.sh}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env - run ./start.sh}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-2G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1G}
      # No phone-home. (server.metrics.* is Enterprise-only and the Community
      # image rejects it outright.)
      NEO4J_dbms_usage__report_enabled: "false"
      # Used only by the healthcheck below, which needs to authenticate.
      # Deliberately NOT named NEO4J_*: this image turns every NEO4J_ variable
      # into a config setting and then refuses to start on the unknown key.
      HEALTH_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env - run ./start.sh}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      # Named volumes, deliberately NOT under ./data. The app bind-mounts the
      # whole of ./data, so a store nested inside it would put a live database's
      # lock and transaction files inside another container's writable tree.
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # Bolt is what the app actually speaks, and in Neo4j 5 the HTTP listener
      # answers before Bolt is ready - so prove Bolt, not 7474. cypher-shell
      # ships in this image and is a real authenticated round trip.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$HEALTH_PASSWORD\" \"RETURN 1\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
